  net: () => { U.online = !U.online; if (U.online) A.syncNow(); render(); },
  syncNow: () => { if (!U.online || !S.queue.length) return; let n = 0; S.queue.forEach(r => { S.att[r.date + '|' + r.sid] = { st: r.st, at: r.at }; const s = stu(r.sid); if (s) attMsg(s, r.st, r.at || ''); n++; }); S.queue = []; save(); toast(t('synced', { n })); render(); },
  mark: id => { const [sid, st] = id.split('|'); const k = U.attDate + '|' + sid; const cur = U.draft[k] || S.att[k]; if (cur && cur.st === st) U.draft[k] = { st: '', at: null }; else U.draft[k] = { st, at: st === 'p' ? (cur && cur.st === 'p' && cur.at ? cur.at : nowHM()) : null }; render(); },
  allPresent: () => { active().filter(s => s.cls === U.attCls).forEach(s => { const k = U.attDate + '|' + s.id; const cur = U.draft[k] || S.att[k]; if (!cur || cur.st !== 'a') U.draft[k] = { st: 'p', at: (cur && cur.at) || nowHM() }; }); render(); },
  saveAtt: () => { const rows = []; active().filter(s => s.cls === U.attCls).forEach(s => { const d = U.draft[U.attDate + '|' + s.id]; if (d && d.st) rows.push({ date: U.attDate, sid: s.id, st: d.st, at: d.at }); else if (d && !d.st) delete S.att[U.attDate + '|' + s.id]; });
    if (!rows.length) return toast(LANG === 'sw' ? 'Chagua angalau mwanafunzi mmoja' : 'Mark at least one student', true);
    Object.keys(U.draft).filter(k => k.startsWith(U.attDate + '|')).forEach(k => delete U.draft[k]);
    if (!U.online) { rows.forEach(r => S.queue = S.queue.filter(q => !(q.sid === r.sid && q.date === r.date)).concat(r)); save(); toast(t('attQueued')); }
    else { rows.forEach(r => { S.att[r.date + '|' + r.sid] = { st: r.st, at: r.at }; const s = stu(r.sid); if (r.date === today()) attMsg(s, r.st, r.at || ''); }); save(); toast(t('attSaved')); } render(); },
  studForm, saveStud: id => { const n = val('f_name').trim(); if (!n) return toast(t('name'), true); const row = { name: n, dob: val('f_dob'), gender: val('f_g'), cls: val('f_cls'), parent: val('f_par'), phone: val('f_ph') };
    if (id) { Object.assign(stu(id), row); if (window._photo) stu(id).photo = window._photo; } else S.students.push({ id: uid(), adm: 'KIA-' + String(S.students.length + 1).padStart(4, '0'), status: 'active', discount: 0, photo: window._photo || '', ...row });
    save(); closeModal(); toast(t('saved')); render(); },
  moveForm: id => modal(`${mh(t('move'))}<p><b>${esc(stu(id).name)}</b></p>${fld(t('class'), `<select id="mv">${clsOpts(stu(id).cls)}</select>`)}<div class="row" style="justify-content:flex-end"><button class="btn b-out" data-act="close">${t('cancel')}</button><button class="btn" data-act="doMove" data-id="${id}">${t('save')}</button></div>`),
  doMove: id => { stu(id).cls = val('mv'); save(); closeModal(); toast(t('saved')); render(); },
  archive: id => { if (confirm(t('archConf'))) { stu(id).status = 'archived'; save(); render(); } }, restore: id => { stu(id).status = 'active'; save(); render(); },
  delStud: id => { if (confirm(t('delConf'))) { S.students = S.students.filter(s => s.id !== id); S.payments = S.payments.filter(p => p.sid !== id); save(); toast(t('deleted')); render(); } },
  promoteOpen: () => modal(`${mh(t('promote'))}<p class="mut">${t('promoteHelp')}</p><div style="background:var(--navy50);border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px">${S.classes.filter(c => active().some(s => s.cls === c.id)).map(c => `<div class="row"><b>${esc(c.name)}</b> (${active().filter(s => s.cls === c.id).length}) <span class="sp"></span><span style="color:${c.final ? '#a87400' : c.next ? 'var(--navy2)' : '#94a3b8'}">→ ${c.final ? '🎓 ' + t('grad') : c.next ? esc(clsName(c.next)) : t('stays')}</span></div>`).join('')}</div>${fld(t('period'), `<input id="np" placeholder="2027 - Muhula 1">`)}<div class="row" style="justify-content:flex-end"><button class="btn b-out" data-act="close">${t('cancel')}</button><button class="btn b-gold" data-act="promoteGo">⬆️ ${t('promoteGo')}</button></div>`),
  promoteGo: () => { let m = 0, g = 0; const snap = active().map(s => [s, S.classes.find(c => c.id === s.cls)]); snap.forEach(([s, c]) => { if (!c) return; if (c.final) { s.status = 'archived'; s.reason = 'Graduated'; g++; } else if (c.next) { s.cls = c.next; m++; } }); if (val('np')) S.period = val('np'); save(); closeModal(); toast(t('promoted', { m, g })); render(); },
  clsForm: id => { const c = id ? S.classes.find(x => x.id === id) : { name: '', fee: 0, due: '' }; modal(`${mh(id ? t('edit') : t('addClass'))}${fld(t('name'), `<input id="c_n" value="${esc(c.name)}">`)}<div class="fg">${fld(t('fee'), `<input id="c_f" inputmode="numeric" value="${c.fee}">`)}${fld(t('due'), `<input id="c_d" type="date" value="${c.due || ''}">`)}</div><div class="row" style="justify-content:flex-end"><button class="btn b-out" data-act="close">${t('cancel')}</button><button class="btn" data-act="saveCls" data-id="${id || ''}">${t('save')}</button></div>`); },
  saveCls: id => { const n = val('c_n').trim(); if (!n) return; const row = { name: n, fee: +val('c_f') || 0, due: val('c_d') }; if (id) Object.assign(S.classes.find(c => c.id === id), row); else S.classes.push({ id: uid(), teacher: null, next: null, final: false, ...row }); save(); closeModal(); toast(t('saved')); render(); },
  delCls: id => { if (S.students.some(s => s.cls === id)) return toast(t('clsNotEmpty'), true); if (confirm(t('del') + '?')) { S.classes = S.classes.filter(c => c.id !== id); save(); render(); } },
  tchForm: id => { const x = id ? S.teachers.find(t => t.id === id) : { name: '', phone: '' }; modal(`${mh(id ? t('edit') : t('addTeacher'))}${fld(t('name'), `<input id="t_n" value="${esc(x.name)}">`)}${fld(t('phone'), `<input id="t_p" value="${esc(x.phone)}">`)}${fld(t('assign'), S.classes.map(c => `<label style="display:inline-flex;gap:4px;align-items:center;text-transform:none;font-size:12px;margin:2px 8px 2px 0;color:var(--ink)"><input type="checkbox" style="width:auto" class="tc" value="${c.id}" ${id && c.teacher === id ? 'checked' : ''}>${esc(c.name)}</label>`).join(''))}<div class="row" style="justify-content:flex-end"><button class="btn b-out" data-act="close">${t('cancel')}</button><button class="btn" data-act="saveTch" data-id="${id || ''}">${t('save')}</button></div>`); },
  saveTch: id => { const n = val('t_n').trim(); if (!n) return; let x; if (id) { x = S.teachers.find(t => t.id === id); x.name = n; x.phone = val('t_p'); } else { x = { id: uid(), name: n, phone: val('t_p') }; S.teachers.push(x); }
    const sel = [...document.querySelectorAll('.tc:checked')].map(e => e.value); S.classes.forEach(c => { if (sel.includes(c.id)) c.teacher = x.id; else if (c.teacher === x.id) c.teacher = null; }); save(); closeModal(); toast(t('saved')); render(); },
  delTch: id => { if (confirm(t('del') + '?')) { S.teachers = S.teachers.filter(x => x.id !== id); S.classes.forEach(c => { if (c.teacher === id) c.teacher = null; }); save(); render(); } },
  payfor: id => { U.view = 'fees'; render(); A.payForm('s:' + id); },
  payForm: id => { const ed = id && id.startsWith('e:') ? S.payments.find(p => p.id === id.slice(2)) : null; const pre = id && id.startsWith('s:') ? id.slice(2) : ed ? ed.sid : '';
    const b = pre ? bal(stu(pre)) : null;
    modal(`${mh(ed ? t('editPay') : t('recPay'))}${fld(t('pickStud'), `<select id="p_s" ${ed ? 'disabled' : ''} data-ch="payStud"><option value="">-</option>${active().map(s => `<option value="${s.id}" ${s.id === pre ? 'selected' : ''}>${esc(s.name)} · ${esc(clsName(s.cls))} · ${tzs(bal(s).bal)}</option>`).join('')}</select>`)}
    <div class="fg">${fld(t('amount'), `<input id="p_a" inputmode="numeric" style="font-weight:800;font-size:17px" value="${ed ? ed.amount : b && b.bal > 0 ? b.bal : ''}">`)}${fld(t('date'), `<input id="p_d" type="date" value="${ed ? ed.date : today()}">`)}</div>
    ${fld(t('method'), `<div class="grid" style="grid-template-columns:repeat(3,1fr)" id="mm">${METHODS.map(m => `<button type="button" class="btn ${(ed ? ed.method : 'mpesa') === m ? 'b-gold' : 'b-out'} b-sm" data-act="pickM" data-id="${m}">${t('m_' + m)}</button>`).join('')}</div><input type="hidden" id="p_m" value="${ed ? ed.method : 'mpesa'}">`)}${fld(t('ref'), `<input id="p_r" value="${esc(ed ? ed.ref : '')}">`)}
    <div class="row" style="justify-content:flex-end"><button class="btn b-out" data-act="close">${t('cancel')}</button><button class="btn b-green" data-act="savePay" data-id="${ed ? ed.id : ''}">${t('save')}${ed ? '' : ' + ' + t('receipt')}</button></div>`); },
  pickM: id => { $('#p_m').value = id; $('#mm').querySelectorAll('button').forEach(b => b.className = 'btn ' + (b.dataset.id === id ? 'b-gold' : 'b-out') + ' b-sm'); },
  savePay: id => { const sid = val('p_s'), amt = +val('p_a'); if (!sid && !id) return toast(t('pickStud'), true); if (!(amt > 0)) return toast(t('amount'), true);
    if (id) { Object.assign(S.payments.find(p => p.id === id), { amount: amt, date: val('p_d'), method: val('p_m'), ref: val('p_r') }); save(); closeModal(); toast(t('saved')); render(); }
    else { const p = { id: uid(), sid, amount: amt, method: val('p_m'), ref: val('p_r'), date: val('p_d'), rc: 'RC-26-' + String(++S.rc).padStart(5, '0') }; S.payments.push(p); save(); toast(t('paySaved')); render(); receipt(p); } },
  delPay: id => { if (confirm(t('del') + '?')) { S.payments = S.payments.filter(p => p.id !== id); save(); toast(t('deleted')); render(); } },
  rcpt: id => receipt(S.payments.find(p => p.id === id)), report: reportCard,
  runRem: () => { const n = reminders(); save(); toast(t('remMade', { n })); render(); },
  markSent: id => { const m = S.msgs.find(x => x.id === id); if (m) { m.st = 'sent'; save(); setTimeout(render, 50); } },
  addSub: () => modal(`${mh(t('subjects'))}${fld('Kiswahili', `<input id="s_sw">`)}${fld('English', `<input id="s_en">`)}<div class="row" style="justify-content:flex-end"><button class="btn b-out" data-act="close">${t('cancel')}</button><button class="btn" data-act="saveSub">${t('save')}</button></div>`),
  saveSub: () => { const sw = val('s_sw').trim(); if (!sw) return; S.subjects.push({ id: uid(), sw, en: val('s_en').trim() || sw }); save(); closeModal(); render(); },
  delSub: id => { if (confirm(t('del') + '?')) { S.subjects = S.subjects.filter(m => m.id !== id); save(); render(); } },
  payNow: () => { const s = MY_CHILD(), b = bal(s); modal(`${mh(t('payTitle'))}<div style="background:var(--navy50);border-radius:14px;padding:12px;margin-bottom:10px"><small class="mut">${t('payTo')} (M-Pesa)</small><div style="font-size:26px;font-weight:900;color:var(--navy2)">${esc(S.payNum)}</div><div class="mut">${esc(S.payName)}</div></div><div style="background:var(--gold50);border-radius:14px;padding:12px;margin-bottom:10px"><small class="mut">${t('payRef')}</small><div style="font-size:20px;font-weight:800">${s.adm}</div></div><div style="text-align:center;font-size:22px;font-weight:900;color:var(--red);margin-bottom:10px">${tzs(b.bal)}</div><a class="btn b-green" style="width:100%;justify-content:center;padding:13px" href="tel:*150*00%23">📞 ${t('dial')}</a><p class="mut" style="text-align:center">${t('afterPay')}</p>`); },
  resetDemo: () => { if (confirm(t('resetConf'))) { S = seed(); save(); U.draft = {}; render(); } },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (!f) return; if (el.dataset.act === 'ovclose') return f(e); if (el.tagName === 'A' && el.dataset.act === 'markSent') { f(el.dataset.id); return; } f(el.dataset.id, e); });
document.addEventListener('input', e => { const el = e.target; if (el.dataset.in) { const k = el.dataset.in; if (k === 'q') U.q = el.value; render(); }
  if (el.dataset.mark) { const [sid, mid] = el.dataset.mark.split('|'); const v = el.value.trim(); if (v !== '' && (!/^\d{0,3}(\.\d?)?$/.test(v) || +v > 100)) { el.value = S.marks[el.dataset.mark] ?? ''; return; } if (v === '') delete S.marks[el.dataset.mark]; else S.marks[el.dataset.mark] = +v; save(); render(); } });
document.addEventListener('change', e => { const el = e.target; const k = el.dataset.in; if (k && k !== 'q') { if (k === 'cls') U.cls = el.value; else if (k === 'attCls') U.attCls = el.value; else if (k === 'rcls') U.rcls = el.value; else if (k === 'month') U.month = el.value; else if (k === 'attDate') U.attDate = el.value || today(); render(); }
  const c = el.dataset.ch; if (!c) return; const id = el.dataset.id; const cl = () => S.classes.find(x => x.id === id);
  if (c === 'clsTeacher') cl().teacher = el.value || null; if (c === 'clsNext') { if (el.value === 'final') { cl().final = true; cl().next = null; } else { cl().final = false; cl().next = el.value || null; } }
  if (c === 'feeAmt') cl().fee = +el.value.replace(/\D/g, '') || 0; if (c === 'feeDue') cl().due = el.value; if (c === 'dueOnly') U.dueOnly = el.checked; if (c === 'set') S[id] = el.value;
  if (c === 'payStud') { const b = bal(stu(el.value)); $('#p_a').value = b.bal > 0 ? b.bal : ''; return; } save(); if (c === 'set') { $('#school').textContent = S.school; return; } render(); });
render();
</script>
